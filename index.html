<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Database</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: sans-serif; }
        #frame { width: 100%; height: 100%; border: none; display: none; }
        #container { padding: 40px; text-align: center; }
        .btn { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; text-decoration: none; }
    </style>
</head>
<body>
    <div id="container">
        <h2>Educational Workspace Assets</h2>
        <p>Click below to initialize the secure network bridge module.</p><br>
        <button class="btn" onclick="launchBridge()">Launch Workspace</button>
    </div>
    <iframe id="frame"></iframe>

    <script>
        function launchBridge() {
            // Decodes a secure web gateway mirror hidden in Base64 strings to evade local sniffers
            var target = atob("aHR0cHM6Ly9jb29saHVidzEuZ2l0aHViLmlvL3Rlc3Qv");
            document.getElementById('container').style.display = 'none';
            var f = document.getElementById('frame');
            f.style.display = 'block';
            f.src = target;
        }
    </script>
</body>
</html>
